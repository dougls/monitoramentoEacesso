global:
  scrape_interval: 15s # Intervalo padrão de coleta
  evaluation_interval: 15s # Intervalo de avaliação de regras
  external_labels:
    cluster: 'docker-local'
    environment: 'development'

# Configuração de scrape (coleta de métricas)
scrape_configs:
  # Monitoramento do próprio Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          app: 'prometheus'
          tier: 'monitoring'

  # Monitoramento da aplicação .NET Weather API
  - job_name: 'weather-api'
    scrape_interval: 10s # Coleta mais frequente para a aplicação
    metrics_path: '/metrics' # Endpoint exposto pelo prometheus-net
    static_configs:
      - targets: ['weather-api:8080']
        labels:
          app: 'weather-api'
          tier: 'application'
          language: 'dotnet'
          framework: 'aspnetcore'

  # Monitoramento do Zabbix Server (se expor métricas)
  - job_name: 'zabbix-server'
    scrape_interval: 30s
    static_configs:
      - targets: ['zabbix-server:10051']
        labels:
          app: 'zabbix-server'
          tier: 'monitoring'

# Configuração de alertas (opcional - para demonstração)
